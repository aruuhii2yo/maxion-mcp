name: CI & Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Documentation & Structural Assets
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          echo "Core repository assets verified."

      - name: Verify Safety & Grounding Standards
        run: |
          node -e "
            const fs = require('fs');
            // Public-facing files. Measured values live in README's Verified Test Results.
            const files = ['README.md', 'glama.json', 'server.json', 'smithery.yaml', 'action.yml', 'action_runner.js', 'package.json']
              .filter(f => fs.existsSync(f));
            const forbidden = [
              '100% immunity', 'complete immunity', 'absolute safety', 'ironclad guarantee', 'stopped dead in their tracks',
              // Previously published, contradicted by measurement (gate is 12-67 us; compression 8-12.7x):
              'nanosecond', 'nano second', '342x', '99.7%', 'unbreakable', 'energy conserved', 'wh saved'
            ];
            let failed = false;
            for (const f of files) {
              const text = fs.readFileSync(f, 'utf8').toLowerCase();
              for (const phrase of forbidden) {
                if (text.includes(phrase)) {
                  console.error('Forbidden ungrounded phrase in ' + f + ': ' + phrase);
                  failed = true;
                }
              }
            }
            if (failed) process.exit(1);
            console.log('Grounded claims check passed across ' + files.length + ' public files.');
          "
