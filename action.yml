name: 'Maxion AI Security & Energy Governor'
description: 'Scans your repository for known prompt-injection phrases and fails the step when one is found.'
author: 'aruuhii2yo'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  gateway-url:
    description: 'Optional Maxion gateway base URL to health-check. Leave empty (default) to scan entirely inside the runner.'
    required: false
    default: ''
  scan-path:
    description: 'Path or file to scan for known prompt-injection phrases'
    required: false
    default: '.'
  fail-on-threat:
    description: 'Fail the step if any file matches a known prompt-injection phrase'
    required: false
    default: 'true'
  energy-pacing:
    description: 'Deprecated, no effect. This Action does not pace or throttle CI runners.'
    required: false
    default: 'false'
outputs:
  status:
    description: 'passed if no file matched, otherwise quarantined'
  threats-intercepted:
    description: 'Number of files that matched a known prompt-injection phrase'
runs:
  using: 'node20'
  main: 'action_runner.js'
